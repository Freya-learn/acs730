name: assignment1

on:
  pull_request:
    paths:
      - "assignment1/**"
      - ".github/workflows/assignment1.yml"
  push:
    branches: [ main ]
    paths:
      - "assignment1/**"
      - ".github/workflows/assignment1.yml"

concurrency:
  group: assignment1-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # Pull request: check and plan staging only. Nothing is applied.
  # prod cannot run here: its environment only allows the main branch.
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: assignment1/terraform/environments/staging
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS session credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - run: aws sts get-caller-identity

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.3
          terraform_wrapper: false

      - name: terraform fmt check
        run: terraform fmt -check -recursive ../..

      - name: terraform init
        run: terraform init -input=false

      - name: terraform validate
        run: terraform validate -no-color

      - name: terraform plan
        run: terraform plan -input=false -no-color

  # Push to main: staging applies with no human in the loop.
  deploy-staging:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: assignment1/terraform/environments/staging
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS session credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - run: aws sts get-caller-identity

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.3
          terraform_wrapper: false

      - name: terraform init
        run: terraform init -input=false

      - name: terraform apply
        run: terraform apply -input=false -auto-approve -no-color

  # prod waits for the required reviewer on the prod environment,
  # and only starts after staging has applied successfully.
  deploy-prod:
    if: github.event_name == 'push'
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: prod
    defaults:
      run:
        working-directory: assignment1/terraform/environments/prod
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS session credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - run: aws sts get-caller-identity

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.3
          terraform_wrapper: false

      - name: terraform init
        run: terraform init -input=false

      - name: terraform apply
        run: terraform apply -input=false -auto-approve -no-color
